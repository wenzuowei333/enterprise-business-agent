name: Local Mock acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: portfolio-inventory-ci
      SHOWCASE_IMAGE_TAG: ci
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and browser
        run: |
          python -m pip install -r backend/requirements-dev.lock playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run isolated acceptance and empty-volume rebuild
        run: python ci/run.py --fresh-data-check
      - name: Upload sanitized summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-summary
          path: runtime/ci/public/summary.json
          if-no-files-found: error
      - name: Stop dedicated CI services
        if: always()
        run: docker compose -f docker-compose.yml -f ci/compose.offline.yml --profile app --profile checks down -v --remove-orphans
