name: Full project validation
on:
  push:
    branches: [main, 'codex/full-project-showcase']
  pull_request:
jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio_demo
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: erp_full_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio_demo -d erp_full_demo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://portfolio_demo:local-demo-only@127.0.0.1:5432/erp_full_demo
      STAGE4_TEST_DATABASE_URL: postgresql+psycopg://portfolio_demo:local-demo-only@127.0.0.1:5432/erp_full_tests
      UPLOAD_ROOT: /tmp/portfolio-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: Create separate empty database for concurrency fixtures
        run: PGPASSWORD=local-demo-only createdb -h 127.0.0.1 -U portfolio_demo erp_full_tests
      - run: alembic upgrade head
        working-directory: backend
      - run: npm ci --no-audit --no-fund && npm run build && npm run test:assertions
        working-directory: frontend
      - run: python -m pytest -q --junitxml=../runtime/backend-tests.xml
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker compose -f docker-compose.demo.yml up -d --build --wait
      - run: python demo/full_smoke.py
      - run: docker compose -f docker-compose.demo.yml down -v --remove-orphans
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-project-validation
          path: |
            runtime/backend-tests.xml
            runtime/full-app-smoke.json
