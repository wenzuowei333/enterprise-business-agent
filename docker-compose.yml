name: portfolio-inventory-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_demo
      POSTGRES_USER: portfolio_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_demo -d inventory_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: postgresql+psycopg://portfolio_demo:local-demo-only@postgres:5432/inventory_demo
      AI_MODE: mock
    command: ["sh", "-c", "alembic upgrade head && python -m demo.seed"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  demo_postgres:
